services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: paperlens
      POSTGRES_USER: paperlens
      POSTGRES_PASSWORD: paperlens
    ports:
      - "5432:5432"
    volumes:
      - paperlens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperlens -d paperlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://paperlens:paperlens@postgres:5432/paperlens
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_MEDIA_ROOT: /app/media
      PAPERLENS_DURABLE_WORKFLOW_ENABLED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - paperlens-media:/app/media
      - paperlens-hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_langgraph_checkpoints &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  celery-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://paperlens:paperlens@postgres:5432/paperlens
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - ./backend:/app
      - paperlens-media:/app/media
      - paperlens-hf-cache:/root/.cache/huggingface
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    # --concurrency=1 -P solo: BGE-M3 is ~2GB resident; forking N workers would
    # each lazily load it and risk OOM. Solo pool keeps one in-memory model.
    command: celery -A config worker -l info --concurrency=1 -P solo

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  paperlens-postgres:
  paperlens-media:
  paperlens-hf-cache:
